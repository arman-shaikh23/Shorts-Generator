name: Deploy Azure Container App

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RESOURCE_GROUP: rg-reelforge-prod
      LOCATION: centralindia
      CONTAINER_APP_ENV: cae-reelforge-prod
      CONTAINER_APP_NAME: ca-reelforge-prod
      ACR_NAME: acrreelforgeprod123
      STORAGE_ACCOUNT_NAME: streelforgeprod123
      DB_NAME: realestate_shorts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate required secrets
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
        run: |
          $required = @(
            "AZURE_SUBSCRIPTION_ID",
            "JWT_SECRET",
            "GEMINI_API_KEY",
            "MONGODB_URL"
          )
          $missing = @()
          foreach ($name in $required) {
            $value = [System.Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Secrets: $($missing -join ', ')"
          }

      - name: Deploy to Azure Container Apps
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
        run: |
          $params = @{
            SubscriptionId          = $env:AZURE_SUBSCRIPTION_ID
            ResourceGroup           = $env:RESOURCE_GROUP
            Location                = $env:LOCATION
            ContainerAppEnvironment = $env:CONTAINER_APP_ENV
            ContainerAppName        = $env:CONTAINER_APP_NAME
            AcrName                 = $env:ACR_NAME
            StorageAccountName      = $env:STORAGE_ACCOUNT_NAME
            JwtSecret               = $env:JWT_SECRET
            GeminiApiKey            = $env:GEMINI_API_KEY
            MongoConnectionString   = $env:MONGODB_URL
            DbName                  = $env:DB_NAME
            UseLocalDockerBuild     = $true
          }
          ./scripts/deploy-azure-container-app.ps1 @params
