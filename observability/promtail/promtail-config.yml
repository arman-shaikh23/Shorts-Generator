server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: reelforge-backend-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: reelforge-backend
          app: reelforge-backend
          __path__: /var/log/reelforge/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            message: message
            request_id: request_id
            trace_id: trace_id
            span_id: span_id
      - labels:
          level:
          logger:
          request_id:
          trace_id:
          span_id:

