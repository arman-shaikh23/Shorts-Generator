services:
  grafana:
    image: grafana/grafana:11.1.4
    container_name: reelforge-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: reelforge-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  loki:
    image: grafana/loki:3.1.1
    container_name: reelforge-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command:
      - "-config.file=/etc/loki/config.yml"

  promtail:
    image: grafana/promtail:3.1.1
    container_name: reelforge-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../backend/logs:/var/log/reelforge:ro
      - promtail-positions:/tmp/promtail
    command:
      - "-config.file=/etc/promtail/config.yml"
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.5.0
    container_name: reelforge-tempo
    restart: unless-stopped
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/tmp/tempo
    command:
      - "-config.file=/etc/tempo.yml"

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  promtail-positions:
  tempo-data:

